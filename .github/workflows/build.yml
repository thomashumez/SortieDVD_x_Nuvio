name: Build and Deploy Nuvio Catalog

on:
  workflow_dispatch:
    inputs:
      discovery_mode:
        description: "Crawl mode (auto=first run full then incremental)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - full
          - incremental
      full_archive_pages:
        description: "Only for full mode: archive pages limit"
        required: false
        default: "4000"
        type: string
      full_movie_fetch:
        description: "Only for full mode: movie fetch limit"
        required: false
        default: "2500"
        type: string
  schedule:
    - cron: "17 0-6 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - requirements.txt
      - scripts/build_catalog.py
      - build_catalog.py

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.nightly_gate.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nightly randomized slot gate
        id: nightly_gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Not a scheduled run, build will execute."
            exit 0
          fi

          current_hour=$(date -u +%H)
          current_hour=$((10#$current_hour))
          seed="$(date -u +%F)-${{ github.repository }}"
          digest=$(printf "%s" "$seed" | sha256sum | cut -c1-8)
          target_hour=$((16#$digest % 7))

          echo "Scheduled run hour (UTC): $current_hour"
          echo "Selected pseudo-random hour (UTC): $target_hour"

          if [[ "$current_hour" -eq "$target_hour" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Nightly slot matched, running build."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Nightly slot not matched, skipping build for this trigger."
          fi

      - name: Setup Python
        if: steps.nightly_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scraper cache
        if: steps.nightly_gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: ${{ runner.os }}-guide-rapide-cache-v1-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-guide-rapide-cache-v1-

      - name: Install dependencies
        if: steps.nightly_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve build mode
        if: steps.nightly_gate.outputs.should_run == 'true'
        id: resolve_mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            discovery_mode="incremental"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            discovery_mode="${{ inputs.discovery_mode || 'auto' }}"
          else
            discovery_mode="auto"
          fi

          echo "discovery_mode=$discovery_mode" >> "$GITHUB_OUTPUT"
          echo "Effective discovery mode: $discovery_mode"

      - name: Build static site
        if: steps.nightly_gate.outputs.should_run == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          GR_DISCOVERY_MODE: ${{ steps.resolve_mode.outputs.discovery_mode }}
          GR_FULL_ARCHIVE_PAGES: ${{ inputs.full_archive_pages || '4000' }}
          GR_FULL_MOVIE_FETCH_PER_RUN: ${{ inputs.full_movie_fetch || '2500' }}
        run: python -u scripts/build_catalog.py

      - name: Setup Pages
        if: steps.nightly_gate.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.nightly_gate.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
